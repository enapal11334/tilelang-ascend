operator:
  name: gemm_allreduce
  category: Fusion
  formula: "Y = A_0 @ W_0.T + A_1 @ W_1.T, replicated on both ranks"
  attrs:
    - name: world_size
      type: Int
      default: 2
      required: true
    - name: rank
      type: Int
      required: true
    - name: epoch
      type: Int
      required: true
  inputs:
    - name: A
      dtype: [float16]
    - name: W
      dtype: [float16]
  outputs:
    - name: Y
      dtype: [float32]
  schema: "build_gemm_allreduce(M, N, K_local, rank) -> kernel(A, W, partial, flags, Y, epoch)"
  constraints:
    topology: "one node, two Ascend 910C devices"
    alignment: "M % 32 == 0, N % 64 == 0, K_local % 64 == 0; positive dimensions"
    workspace: "SHMEM partial FP32 [tiles,32,64], flags int32 [tiles,32]"
    epoch: "same on both ranks, strictly increasing, 0 < epoch < 2**31"
